name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  deploy-docs:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Skips regenerating/publishing docs when none of their inputs changed since the last run.
      - name: Check for docs source changes
        id: docs-cache
        uses: actions/cache@v4
        with:
          path: .docs-cache-marker
          key: docs-v1-${{ hashFiles('packages/core/src/**', 'packages/core/README.md', 'typedoc.json') }}

      - name: Generate docs
        if: steps.docs-cache.outputs.cache-hit != 'true'
        run: |
          pnpm run docs
          touch .docs-cache-marker

      - name: Configure Pages
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        if: steps.docs-cache.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/api

      - name: Deploy to GitHub Pages
        if: steps.docs-cache.outputs.cache-hit != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
